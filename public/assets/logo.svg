<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#14141E" />
      <stop offset="100%" stop-color="#08080C" />
    </radialGradient>
    
    <!-- Electric Orange to Crimson Gradient -->
    <linearGradient id="nGradient" x1="160" y1="130" x2="350" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7552" />
      <stop offset="45%" stop-color="#FF3B1D" />
      <stop offset="100%" stop-color="#E82400" />
    </linearGradient>

    <!-- Inner Core Lightning Sheen -->
    <linearGradient id="coreSheen" x1="180" y1="140" x2="320" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Ambient Shadow & Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF3B1D" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Badge Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGlow)" stroke="#262638" stroke-width="6" />
  <rect x="26" y="26" width="460" height="460" rx="106" stroke="#FF3B1D" stroke-opacity="0.25" stroke-width="2" />

  <!-- Monogram N Structure with Glow -->
  <g filter="url(#softGlow)">
    <path
      d="M 148 368 
         V 156 
         C 148 144 156 138 168 138 
         H 192 
         C 202 138 210 142 216 150 
         L 312 298 
         V 156 
         C 312 144 320 138 332 138 
         H 348 
         C 360 138 364 144 364 156 
         V 356 
         C 364 368 356 374 344 374 
         H 320 
         C 310 374 302 370 296 362 
         L 200 214 
         V 356 
         C 200 368 192 374 180 374 
         H 164 
         C 152 374 148 368 148 356 
         Z"
      fill="url(#nGradient)"
    />
    <!-- Delicate Light Sheen across top curve -->
    <path
      d="M 148 240 V 156 C 148 144 156 138 168 138 H 192 C 202 138 210 142 216 150 L 312 298 V 156 C 312 144 320 138 332 138 H 348 C 360 138 364 144 364 156 V 230 Z"
      fill="url(#coreSheen)"
    />
  </g>
</svg>
